<html>
<head>
<title>Property Listing</title>
</head>
<body>

<h1>Property Listing Form</h1>

<form>

Owner Name: <input type="text" name="owner">
<br><br>

Email: <input type="email" name="email">
<br><br>

Phone: <input type="tel" name="phone">
<br><br>

Property Type:
<select name="type">
<option>House</option>
<option>Flat</option>
<option>Plot</option>
<option>Shop</option>
<option>Office</option>
</select>
<br><br>

City: <input type="text" name="city" list="cities">
<datalist id="cities">
<option value="Lahore">
<option value="Karachi">
<option value="Islamabad">
<option value="Rawalpindi">
<option value="Peshawar">
</datalist>
<br><br>

Number of Bedrooms: <input type="number" name="bedrooms">
<br><br>

Price: <input type="number" name="price">
<br><br>

Availability Date: <input type="date" name="date">
<br><br>

Property Website: <input type="url" name="website">
<br><br>

Property Description:
<br>
<textarea name="description" rows="5" cols="40"></textarea>
<br><br>

Upload Property Images: <input type="file" name="images" multiple>
<br><br>

Property Features:
<br>
<input type="checkbox" name="garage"> Garage
<br>
<input type="checkbox" name="garden"> Garden
<br>
<input type="checkbox" name="ac"> Air Conditioning
<br>
<input type="checkbox" name="furnished"> Furnished
<br>
<input type="checkbox" name="security"> Security
<br><br>

<input type="submit" value="Submit">

</form>

</body>
</html>
