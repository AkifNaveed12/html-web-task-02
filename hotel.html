<html>
<head>
<title>Hotel Room Booking</title>
</head>
<body>

<h1>Hotel Room Booking Form</h1>

<form>

Guest Name: <input type="text" name="guestname">
<br><br>

Email: <input type="email" name="email">
<br><br>

Password: <input type="password" name="password">
<br><br>

Number of Guests: <input type="number" name="guests">
<br><br>

Room Type:
<select name="roomtype">
<option>Single</option>
<option>Double</option>
<option>Deluxe</option>
<option>Suite</option>
</select>
<br><br>

Additional Facilities:
<br>
<input type="checkbox" name="wifi"> WiFi
<br>
<input type="checkbox" name="breakfast"> Breakfast
<br>
<input type="checkbox" name="parking"> Parking
<br>
<input type="checkbox" name="pool"> Swimming Pool
<br><br>

Gender:
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<br><br>

Check-in Date: <input type="date" name="checkin">
<br><br>

Check-out Date: <input type="date" name="checkout">
<br><br>

Preferred Check-in Time: <input type="time" name="checkintime">
<br><br>

Website: <input type="url" name="website">
<br><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

</body>
</html>
