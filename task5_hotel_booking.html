<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking</title>
</head>
<body>
    <h1>Hotel Room Booking Form</h1>
    <p>Book your comfortable stay with us.</p>
    <hr>

    <form action="#" method="post">
        <fieldset>
            <legend>Guest Information</legend>

            <label for="name">Guest Name:</label><br>
            <input type="text" id="name" name="guest_name" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required><br><br>

            <label for="guests">Number of Guests:</label><br>
            <input type="number" id="guests" name="guests" min="1" required><br><br>

            <strong>Gender:</strong><br>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
        </fieldset>

        <br>

        <fieldset>
            <legend>Booking Details</legend>

            <label for="room">Room Type:</label><br>
            <select id="room" name="room_type" required>
                <option value="">-- Select Room --</option>
                <option value="single">Single Room</option>
                <option value="double">Double Room</option>
                <option value="deluxe">Deluxe Room</option>
                <option value="suite">Suite</option>
            </select><br><br>

            <strong>Additional Facilities:</strong><br>
            <input type="checkbox" id="breakfast" name="facilities" value="Breakfast">
            <label for="breakfast">Breakfast</label><br>
            <input type="checkbox" id="wifi" name="facilities" value="WiFi">
            <label for="wifi">Wi-Fi</label><br>
            <input type="checkbox" id="parking" name="facilities" value="Parking">
            <label for="parking">Parking</label><br>
            <input type="checkbox" id="pickup" name="facilities" value="Airport Pickup">
            <label for="pickup">Airport Pickup</label><br><br>

            <label for="checkin">Check-in Date:</label><br>
            <input type="date" id="checkin" name="checkin" required><br><br>

            <label for="checkout">Check-out Date:</label><br>
            <input type="date" id="checkout" name="checkout" required><br><br>

            <label for="time">Preferred Check-in Time:</label><br>
            <input type="time" id="time" name="checkin_time" required><br><br>

            <label for="website">Website/URL:</label><br>
            <input type="url" id="website" name="website" placeholder="https://example.com">
        </fieldset>

        <br>
        <input type="submit" value="Book Room">
        <input type="reset" value="Reset">
    </form>

    <hr>
    <p>&copy; 2026 Hotel Room Booking</p>
</body>
</html>
