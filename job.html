<html>
<head>
<title>Job Application</title>
</head>
<body>

<h1>Job Application Form</h1>

<form>

Applicant Name: <input type="text" name="name">
<br><br>

Email: <input type="email" name="email">
<br><br>

Phone Number: <input type="tel" name="phone">
<br><br>

Password: <input type="password" name="password">
<br><br>

Gender:
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<br><br>

Qualification:
<input type="radio" name="qualification"> Matric
<input type="radio" name="qualification"> Intermediate
<input type="radio" name="qualification"> Bachelors
<input type="radio" name="qualification"> Masters
<br><br>

Job Position:
<select name="position">
<option>Web Developer</option>
<option>Software Engineer</option>
<option>Graphic Designer</option>
<option>Accountant</option>
<option>Manager</option>
</select>
<br><br>

City: <input type="text" name="city" list="cities">
<datalist id="cities">
<option value="Lahore">
<option value="Karachi">
<option value="Islamabad">
<option value="Faisalabad">
<option value="Multan">
</datalist>
<br><br>

Expected Salary: <input type="number" name="salary">
<br><br>

Available Date: <input type="date" name="date">
<br><br>

Upload CV: <input type="file" name="cv">
<br><br>

Cover Letter:
<br>
<textarea name="coverletter" rows="5" cols="40"></textarea>
<br><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

</form>

</body>
</html>
